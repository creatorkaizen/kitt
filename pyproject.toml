[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kittgen"
version = "0.1.0"
description = "Build-time YAML layout parser/validator/generator for the Kitt Ukrainian mnemonic keyboard layout"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kittgen = "kittgen.cli:main"

[tool.setuptools]
package-dir = { "" = "generator" }

[tool.setuptools.packages.find]
where = ["generator"]
